<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="description"
      content="A gentle farmyard game for learning English animal words, sounds, and a soft save-the-animals story."
    />
    <title>Farmyard Friends</title>
    <link rel="icon" href="/art/cow.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="hud">
          <div id="round-label">
            <p id="round-title"></p>
            <p id="round-title-ru" lang="ru"></p>
          </div>
          <div class="caption-card">
            <p id="round-help"></p>
            <p id="round-help-ru" lang="ru"></p>
            <p id="caption" role="status" aria-live="polite"></p>
            <div id="progress" aria-hidden="true"></div>
          </div>
        </div>
        <button id="again" class="ghost" type="button" disabled>
          <span class="btn-en">Hear it again</span>
          <span class="btn-ru" lang="ru">Ещё раз</span>
        </button>
        <div id="memory" hidden>
          <div id="memory-board"></div>
        </div>
      </div>
      <div id="overlay">
        <div class="card">
          <p class="eyebrow">
            <span id="eyebrow-en">English on the farm</span>
            <span id="eyebrow-ru" lang="ru">Английский на ферме</span>
          </p>
          <h1 id="overlay-title">Farmyard Friends</h1>
          <p id="overlay-copy">
            <span id="overlay-en">Listen, then tap the animal.</span>
            <span id="overlay-ru" lang="ru">Слушай и нажимай на животное.</span>
          </p>
          <button id="play" class="primary" type="button" disabled>
            <span class="btn-en">Please wait</span>
            <span class="btn-ru" lang="ru">Подождите</span>
          </button>
        </div>
      </div>
      <div id="rotate">
        <p>Turn your tablet sideways</p>
        <p lang="ru">Поверните планшет</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
